services:
  mandalorian:
    build: dnsserver
    hostname: mandalorian
    networks:
      rededns:
        ipv4_address: 192.168.20.9
    volumes:
      - ./mandalorian/named.conf.options:/etc/bind/named.conf.options

  darthvader:
    build: dnsserver
    hostname: darthvader
    depends_on:
      - mandalorian
    networks:
      rededns:
        ipv4_address: 192.168.20.10
    volumes:
      - ./darthvader/named.conf.local:/etc/bind/named.conf.local
      - ./darthvader/zonas/db.starwars.lan:/etc/bind/db.starwars.lan
      - ./darthvader/zonas/db.20.168.192:/etc/bind/db.20.168.192

  darthsidious:
    build: dnsserver
    hostname: darthsidious
    depends_on:
      - mandalorian
      - darthvader
    networks:
      rededns:
        ipv4_address: 192.168.20.11
    volumes:
      - ./darthsidious/named.conf.local:/etc/bind/named.conf.local # Non se necesitan as outras rutas de archivos porque ao referencialos no named.conf.local xa se fai a transferencia automática
    
  delegado:
    build: dnsserver
    hostname: delegado
    depends_on:
      - mandalorian
      - darthvader
      - darthsidious
    networks:
      rededns:
        ipv4_address: 192.168.20.8
    volumes:
      - ./delegado/named.conf.local:/etc/bind/named.conf.local
      - ./delegado/zonas/db.test.starwars.lan:/etc/bind/db.test.starwars.lan

  lukeskywalker:
    build: dnsserver
    hostname: lukeskywalker
    depends_on:
      - mandalorian
      - darthvader
      - darthsidious
      - delegado
    networks:
      rededns:
        ipv4_address: 192.168.20.22
    volumes:
      - ./lukeskywalker/named.conf.local:/etc/bind/named.conf.local
      - ./lukeskywalker/zonas/db.test.starwars.lan:/etc/bind/db.test.starwars.lan

  cliente:
    build: cliente
    hostname: cliente1
    networks:
      rededns:
        ipv4_address: 192.168.20.110
    volumes:
      - ./cliente/rndc.conf:/etc/bind/rndc.conf
      - ./cliente/chave.key:/etc/bind/chave.key
      - ./cliente/actualiza.txt:/etc/bind/actualiza.txt
    dns: 
    - 192.168.20.10
    - 192.168.20.11
    - 192.168.20.8

networks:
  rededns:
    ipam:
      config:
        - subnet: 192.168.20.0/24


